name: Marketplace identity

# Manual helper: logs in to Microsoft Entra ID with the federated credential (no secrets) and
# prints the Azure DevOps profile id of the publishing identity. Add that id as a Contributor
# member of the Marketplace publisher (marketplace.visualstudio.com/manage → Members).
# Also a smoke test of the OIDC trust before a real release.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Identity of the service principal (organization and global scopes)
        # Service principals have no Azure DevOps "profile". Their identity id comes from
        # connectionData: of the organization (alex-roc, Stakeholder) and of the global
        # SPS scope (app.vssps), which is the one the Marketplace members list resolves.
        run: |
          R=499b84ac-1321-427f-aa17-267ca6975798
          for url in "https://dev.azure.com/alex-roc/_apis/connectionData?api-version=7.1-preview" \
                     "https://app.vssps.visualstudio.com/_apis/connectionData?api-version=7.1-preview"; do
            echo "== $url"
            az rest -u "$url" --resource $R --query "authenticatedUser.{id: id, descriptor: descriptor, name: providerDisplayName}" -o json || true
          done
      - name: Can it publish as alex-roc?
        run: |
          TOKEN=$(az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken -o tsv)
          npx --yes @vscode/vsce@4.0.0 verify-pat -p "$TOKEN" alex-roc || true
