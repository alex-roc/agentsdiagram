name: Marketplace identity

# Manual helper: logs in to Microsoft Entra ID with the federated credential (no secrets) and
# prints the Azure DevOps profile id of the publishing identity. Add that id as a Contributor
# member of the Marketplace publisher (marketplace.visualstudio.com/manage → Members).
# Also a smoke test of the OIDC trust before a real release.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Azure DevOps profile of the service principal
        run: |
          az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query "{id: id, displayName: displayName}" -o json
