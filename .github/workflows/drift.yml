name: Library drift

# PydanticAI ships several releases a week. Every Monday, run the oracle and symbol-drift
# tests against the latest pydantic-ai, pydantic-ai-harness and smolagents, and open an
# issue if a rename or behaviour change broke the adapters.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --upgrade-package pydantic-ai --upgrade-package pydantic-ai-harness --upgrade-package smolagents
      - run: uv pip list | grep -E "pydantic-ai|smolagents" | tee versions.txt
      - id: tests
        run: uv run pytest -q tests/test_oracle.py tests/test_symbols_drift.py 2>&1 | tee result.txt
        continue-on-error: true
      - if: steps.tests.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The weekly drift check failed against the latest library releases."
            echo; echo '```'; cat versions.txt; echo '```'
            echo; echo '```'; tail -60 result.txt; echo '```'
            echo; echo "Update the adapters' symbols.py and docs/adapters/*.md."
          } > body.md
          gh issue create --title "Library drift: adapters out of date ($(date +%F))" --body-file body.md --label drift || \
          gh issue create --title "Library drift: adapters out of date ($(date +%F))" --body-file body.md
