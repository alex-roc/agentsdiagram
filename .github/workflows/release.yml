name: Release

# Push a tag vX.Y.Z (same version in src/agentsdiagram/__init__.py and packages/vscode/package.json)
# to publish the Python package to PyPI and the extension to the VS Code Marketplace and Open VSX.
#
# One-time setup (see docs/releasing.md):
#   - PyPI: Trusted Publisher for this repo + workflow `release.yml` + environment `release`.
#   - Open VSX: secret OVSX_PAT (namespace `alex-roc` claimed).
#   - Marketplace: Entra ID workload identity (secrets AZURE_CLIENT_ID, AZURE_TENANT_ID) or,
#     until global PATs are retired on 2026-12-01, secret VSCE_PAT.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Versions match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PY=$(sed -n 's/__version__ = "\(.*\)"/\1/p' src/agentsdiagram/__init__.py)
          EXT=$(node -p "require('./packages/vscode/package.json').version")
          echo "tag=$TAG python=$PY extension=$EXT"
          test "$TAG" = "$PY" && test "$TAG" = "$EXT"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: uv build
      - run: unzip -l dist/*.whl | grep -q "agentsdiagram/_static/viewer.js"
      - run: pnpm --filter agentsdiagram run package
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: packages/vscode/*.vsix

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  extension:
    # after PyPI: the extension launches `uvx agentsdiagram[lsp]==<version>`, which must exist
    needs: [build, pypi]
    runs-on: ubuntu-latest
    environment: release
    env:
      # step `if:` cannot read step-level env, so the secrets are exposed at job level
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: vsix
          path: vsix/
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx@1.3.0 publish vsix/*.vsix -p "$OVSX_PAT"
      - name: Azure login (Marketplace via Entra ID)
        if: vars.AZURE_CLIENT_ID != ''
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: VS Code Marketplace (Entra ID)
        if: vars.AZURE_CLIENT_ID != ''
        run: npx --yes @vscode/vsce@4.0.0 publish --packagePath vsix/*.vsix --azure-credential
      - name: VS Code Marketplace (PAT, until 2026-12-01)
        if: vars.AZURE_CLIENT_ID == '' && env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce@4.0.0 publish --packagePath vsix/*.vsix -p "$VSCE_PAT"

  github-release:
    needs: [build, pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vsix
          path: vsix/
      - uses: softprops/action-gh-release@v3
        with:
          files: vsix/*.vsix
          generate_release_notes: true
